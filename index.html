<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>StudyBuddy — AI Study Assistant for Engineering Students</title>
  <meta name="description" content="StudyBuddy is an AI-powered study assistant for engineering students. Get instant help with maths, physics, programming, circuits, and more." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    /* ─── Design Tokens ─────────────────────────────────────────────────── */
    :root {
      --bg-base:        #0b0d14;
      --bg-surface:     #111422;
      --bg-card:        #161928;
      --bg-input:       #1c2035;
      --bg-hover:       #222640;
      --accent-primary: #6c63ff;
      --accent-glow:    #6c63ff55;
      --accent-light:   #9b94ff;
      --accent-alt:     #38bdf8;
      --accent-green:   #22d3a5;
      --text-primary:   #e8eaf6;
      --text-secondary: #8892b0;
      --text-muted:     #4a5275;
      --border-subtle:  #1e2340;
      --border-focus:   #6c63ff;
      --danger:         #f87171;
      --warning:        #fbbf24;
      --radius-sm:      8px;
      --radius-md:      14px;
      --radius-lg:      20px;
      --radius-xl:      28px;
      --shadow-glow:    0 0 40px #6c63ff22;
      --shadow-card:    0 8px 32px #00000055;
      --transition:     0.22s cubic-bezier(0.4, 0, 0.2, 1);
    }

    /* ─── Reset & Base ──────────────────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
      font-family: 'Inter', system-ui, sans-serif;
      background: var(--bg-base);
      color: var(--text-primary);
      overflow: hidden;
    }

    /* ─── Background Mesh ───────────────────────────────────────────────── */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background:
        radial-gradient(ellipse 80% 50% at 20% 10%, #6c63ff18 0%, transparent 60%),
        radial-gradient(ellipse 60% 40% at 80% 90%, #38bdf815 0%, transparent 60%),
        radial-gradient(ellipse 50% 60% at 50% 50%, #22d3a508 0%, transparent 70%);
      pointer-events: none;
      z-index: 0;
    }

    /* ─── Layout ────────────────────────────────────────────────────────── */
    #app {
      display: flex;
      flex-direction: column;
      height: 100vh;
      max-width: 820px;
      margin: 0 auto;
      position: relative;
      z-index: 1;
    }

    /* ─── Header ────────────────────────────────────────────────────────── */
    #header {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 18px 24px 16px;
      border-bottom: 1px solid var(--border-subtle);
      background: linear-gradient(180deg, #111422 0%, transparent 100%);
      backdrop-filter: blur(20px);
      position: sticky;
      top: 0;
      z-index: 10;
      flex-shrink: 0;
    }

    .logo-ring {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--accent-primary), var(--accent-alt));
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      flex-shrink: 0;
      box-shadow: 0 0 20px var(--accent-glow), 0 0 0 1px #6c63ff44;
      animation: pulse-ring 3s ease-in-out infinite;
    }

    @keyframes pulse-ring {
      0%, 100% { box-shadow: 0 0 20px var(--accent-glow), 0 0 0 1px #6c63ff44; }
      50%       { box-shadow: 0 0 30px #6c63ff44, 0 0 0 3px #6c63ff22; }
    }

    .header-info { flex: 1; }

    .header-title {
      font-size: 1.1rem;
      font-weight: 700;
      background: linear-gradient(90deg, var(--text-primary), var(--accent-light));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      letter-spacing: -0.01em;
    }

    .header-subtitle {
      font-size: 0.72rem;
      color: var(--text-muted);
      margin-top: 1px;
      font-weight: 400;
      letter-spacing: 0.03em;
    }

    .status-badge {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 0.7rem;
      color: var(--accent-green);
      background: #22d3a512;
      border: 1px solid #22d3a530;
      padding: 4px 10px;
      border-radius: 20px;
      font-weight: 500;
      flex-shrink: 0;
    }

    .status-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--accent-green);
      animation: blink 2s ease-in-out infinite;
    }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50%       { opacity: 0.3; }
    }

    .new-chat-btn {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 7px 14px;
      border-radius: var(--radius-sm);
      border: 1px solid var(--border-subtle);
      background: transparent;
      color: var(--text-secondary);
      font-size: 0.75rem;
      font-weight: 500;
      cursor: pointer;
      transition: var(--transition);
      font-family: inherit;
      flex-shrink: 0;
    }

    .new-chat-btn:hover {
      border-color: var(--accent-primary);
      color: var(--accent-light);
      background: var(--accent-glow);
    }

    /* ─── Chat Messages ─────────────────────────────────────────────────── */
    #messages {
      flex: 1;
      overflow-y: auto;
      padding: 24px 20px;
      display: flex;
      flex-direction: column;
      gap: 18px;
      scroll-behavior: smooth;
    }

    #messages::-webkit-scrollbar { width: 4px; }
    #messages::-webkit-scrollbar-track { background: transparent; }
    #messages::-webkit-scrollbar-thumb {
      background: var(--border-subtle);
      border-radius: 4px;
    }
    #messages::-webkit-scrollbar-thumb:hover { background: var(--text-muted); }

    /* ─── Welcome Screen ────────────────────────────────────────────────── */
    #welcome {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 20px;
      padding: 40px 20px;
      text-align: center;
      flex: 1;
      animation: fade-in 0.5s ease-out;
    }

    .welcome-icon {
      font-size: 52px;
      filter: drop-shadow(0 0 20px #6c63ff55);
    }

    .welcome-title {
      font-size: 1.9rem;
      font-weight: 700;
      background: linear-gradient(135deg, var(--text-primary) 0%, var(--accent-light) 50%, var(--accent-alt) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      letter-spacing: -0.03em;
      line-height: 1.2;
    }

    .welcome-desc {
      font-size: 0.92rem;
      color: var(--text-secondary);
      max-width: 420px;
      line-height: 1.65;
    }

    .suggestion-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      width: 100%;
      max-width: 520px;
      margin-top: 8px;
    }

    .suggestion-chip {
      padding: 12px 16px;
      border-radius: var(--radius-md);
      border: 1px solid var(--border-subtle);
      background: var(--bg-card);
      color: var(--text-secondary);
      font-size: 0.78rem;
      font-weight: 500;
      cursor: pointer;
      text-align: left;
      transition: var(--transition);
      line-height: 1.45;
      font-family: inherit;
    }

    .suggestion-chip:hover {
      border-color: var(--accent-primary);
      color: var(--text-primary);
      background: var(--bg-hover);
      transform: translateY(-1px);
      box-shadow: 0 4px 20px var(--accent-glow);
    }

    .suggestion-chip .chip-icon {
      font-size: 1rem;
      margin-bottom: 4px;
      display: block;
    }

    /* ─── Message Bubbles ───────────────────────────────────────────────── */
    .message-row {
      display: flex;
      gap: 12px;
      align-items: flex-start;
      animation: slide-up 0.3s ease-out;
    }

    @keyframes slide-up {
      from { opacity: 0; transform: translateY(12px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .message-row.user { flex-direction: row-reverse; }

    .avatar {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      flex-shrink: 0;
      margin-top: 2px;
    }

    .avatar.bot-avatar {
      background: linear-gradient(135deg, var(--accent-primary), var(--accent-alt));
      box-shadow: 0 0 12px var(--accent-glow);
    }

    .avatar.user-avatar {
      background: linear-gradient(135deg, #334155, #475569);
      border: 1px solid #475569;
    }

    .bubble {
      max-width: 76%;
      padding: 13px 17px;
      border-radius: var(--radius-lg);
      font-size: 0.875rem;
      line-height: 1.7;
      word-break: break-word;
    }

    .bubble.bot {
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      border-top-left-radius: var(--radius-sm);
      color: var(--text-primary);
    }

    .bubble.user {
      background: linear-gradient(135deg, var(--accent-primary), #7c6ff7);
      border-top-right-radius: var(--radius-sm);
      color: #fff;
      box-shadow: 0 4px 20px var(--accent-glow);
    }

    /* Inline code */
    .bubble code {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.82em;
      padding: 2px 6px;
      border-radius: 4px;
    }

    .bubble.bot code  { background: #0b0d14; color: var(--accent-light); }
    .bubble.user code { background: #ffffff22; }

    /* ─── Typing Indicator ──────────────────────────────────────────────── */
    #typing-indicator {
      display: none;
      gap: 12px;
      align-items: center;
    }

    #typing-indicator.visible { display: flex; }

    .typing-bubble {
      display: flex;
      align-items: center;
      gap: 5px;
      padding: 12px 16px;
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-lg);
      border-top-left-radius: var(--radius-sm);
    }

    .dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--accent-primary);
      animation: bounce 1.2s ease-in-out infinite;
    }

    .dot:nth-child(2) { animation-delay: 0.2s; }
    .dot:nth-child(3) { animation-delay: 0.4s; }

    @keyframes bounce {
      0%, 60%, 100% { transform: translateY(0); opacity: 0.6; }
      30%            { transform: translateY(-6px); opacity: 1; }
    }

    /* ─── Error Banner ──────────────────────────────────────────────────── */
    .error-banner {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 12px 16px;
      border-radius: var(--radius-md);
      border: 1px solid #f8717144;
      background: #f8717110;
      color: var(--danger);
      font-size: 0.82rem;
      animation: slide-up 0.3s ease-out;
      line-height: 1.5;
    }

    .error-banner .err-icon { font-size: 1rem; flex-shrink: 0; }

    /* ─── Input Area ────────────────────────────────────────────────────── */
    #input-area {
      padding: 16px 20px 20px;
      border-top: 1px solid var(--border-subtle);
      background: linear-gradient(0deg, var(--bg-surface) 60%, transparent 100%);
      backdrop-filter: blur(20px);
      flex-shrink: 0;
    }

    .input-wrapper {
      display: flex;
      align-items: flex-end;
      gap: 10px;
      background: var(--bg-input);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-xl);
      padding: 10px 10px 10px 18px;
      transition: var(--transition);
    }

    .input-wrapper:focus-within {
      border-color: var(--border-focus);
      box-shadow: 0 0 0 3px var(--accent-glow);
    }

    #message-input {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      color: var(--text-primary);
      font-size: 0.9rem;
      font-family: inherit;
      resize: none;
      min-height: 22px;
      max-height: 140px;
      line-height: 1.6;
      padding: 2px 0;
    }

    #message-input::placeholder { color: var(--text-muted); }

    #send-btn {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      border: none;
      background: linear-gradient(135deg, var(--accent-primary), #7c6ff7);
      color: #fff;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      transition: var(--transition);
      flex-shrink: 0;
      box-shadow: 0 4px 16px var(--accent-glow);
    }

    #send-btn:hover:not(:disabled) {
      transform: scale(1.08);
      box-shadow: 0 6px 24px var(--accent-glow);
    }

    #send-btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
      transform: none;
      box-shadow: none;
    }

    .input-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 8px;
      padding: 0 4px;
    }

    .input-hint {
      font-size: 0.68rem;
      color: var(--text-muted);
    }

    .char-counter {
      font-size: 0.68rem;
      color: var(--text-muted);
      transition: var(--transition);
    }

    .char-counter.warn { color: var(--warning); }
    .char-counter.over { color: var(--danger); }

    /* ─── Animations ────────────────────────────────────────────────────── */
    @keyframes fade-in {
      from { opacity: 0; transform: scale(0.97); }
      to   { opacity: 1; transform: scale(1); }
    }

    /* ─── Responsive ────────────────────────────────────────────────────── */
    @media (max-width: 600px) {
      #header { padding: 14px 16px 12px; }
      #messages { padding: 16px 12px; gap: 14px; }
      #input-area { padding: 12px 12px 16px; }
      .suggestion-grid { grid-template-columns: 1fr; }
      .bubble { max-width: 88%; }
      .welcome-title { font-size: 1.4rem; }
    }
  </style>
</head>
<body>
  <div id="app">

    <!-- Header -->
    <header id="header">
      <div class="logo-ring" aria-label="StudyBuddy logo">🎓</div>
      <div class="header-info">
        <div class="header-title">StudyBuddy</div>
        <div class="header-subtitle">AI-powered engineering study assistant</div>
      </div>
      <div class="status-badge" id="status-badge">
        <span class="status-dot"></span>
        Online
      </div>
      <button class="new-chat-btn" id="new-chat-btn" title="Start a new conversation" aria-label="Start new chat">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 5v14M5 12h14"/>
        </svg>
        New Chat
      </button>
    </header>

    <!-- Messages -->
    <main id="messages" role="log" aria-label="Chat messages" aria-live="polite">

      <!-- Welcome Screen -->
      <div id="welcome">
        <div class="welcome-icon">🧠</div>
        <h1 class="welcome-title">What do you want<br>to learn today?</h1>
        <p class="welcome-desc">
          Ask me anything about your engineering coursework — maths, physics,
          circuits, programming, thermodynamics, and more.
        </p>
        <div class="suggestion-grid" role="list" aria-label="Suggested questions">
          <button class="suggestion-chip" role="listitem" id="chip-1" onclick="useSuggestion(this)">
            <span class="chip-icon">⚡</span>
            Explain Kirchhoff's Voltage Law with an example
          </button>
          <button class="suggestion-chip" role="listitem" id="chip-2" onclick="useSuggestion(this)">
            <span class="chip-icon">📐</span>
            What is the Fourier Transform and why is it useful?
          </button>
          <button class="suggestion-chip" role="listitem" id="chip-3" onclick="useSuggestion(this)">
            <span class="chip-icon">💻</span>
            Difference between stack and heap memory in C
          </button>
          <button class="suggestion-chip" role="listitem" id="chip-4" onclick="useSuggestion(this)">
            <span class="chip-icon">🌡️</span>
            Explain the first law of thermodynamics simply
          </button>
        </div>
      </div>

      <!-- Typing Indicator (hidden by default) -->
      <div id="typing-indicator" role="status" aria-label="StudyBuddy is thinking">
        <div class="avatar bot-avatar">🎓</div>
        <div class="typing-bubble">
          <span class="dot"></span>
          <span class="dot"></span>
          <span class="dot"></span>
        </div>
      </div>

    </main>

    <!-- Input Area -->
    <footer id="input-area">
      <div class="input-wrapper">
        <textarea
          id="message-input"
          placeholder="Ask anything about your engineering studies…"
          rows="1"
          maxlength="4000"
          aria-label="Message input"
          autocomplete="off"
          spellcheck="true"
        ></textarea>
        <button id="send-btn" aria-label="Send message" title="Send (Enter)">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M22 2L11 13M22 2l-7 20-4-9-9-4 20-7z"/>
          </svg>
        </button>
      </div>
      <div class="input-footer">
        <span class="input-hint">Enter to send · Shift+Enter for new line</span>
        <span class="char-counter" id="char-counter" aria-live="polite">0 / 4000</span>
      </div>
    </footer>

  </div>

  <script>
    // ─── State ──────────────────────────────────────────────────────────────
    let conversationId = null;
    let isLoading = false;

    const messagesEl  = document.getElementById('messages');
    const welcomeEl   = document.getElementById('welcome');
    const typingEl    = document.getElementById('typing-indicator');
    const inputEl     = document.getElementById('message-input');
    const sendBtn     = document.getElementById('send-btn');
    const counterEl   = document.getElementById('char-counter');
    const newChatBtn  = document.getElementById('new-chat-btn');

    // ─── Auto-resize Textarea ────────────────────────────────────────────
    function autoResize() {
      inputEl.style.height = 'auto';
      inputEl.style.height = Math.min(inputEl.scrollHeight, 140) + 'px';
    }

    inputEl.addEventListener('input', () => {
      autoResize();
      const len = inputEl.value.length;
      counterEl.textContent = `${len} / 4000`;
      counterEl.className = 'char-counter' + (len > 3800 ? ' over' : len > 3200 ? ' warn' : '');
    });

    // ─── Keyboard handling ───────────────────────────────────────────────
    inputEl.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        handleSend();
      }
    });

    sendBtn.addEventListener('click', handleSend);

    // ─── Suggestion chips ────────────────────────────────────────────────
    function useSuggestion(btn) {
      const text = btn.innerText.replace(/^[\u{1F300}-\u{1FFFF}\s]+/u, '').trim();
      inputEl.value = text;
      autoResize();
      counterEl.textContent = `${text.length} / 4000`;
      handleSend();
    }

    // ─── New chat ────────────────────────────────────────────────────────
    newChatBtn.addEventListener('click', () => {
      conversationId = null;
      isLoading      = false;

      // Clear messages, re-insert welcome + typing indicator
      messagesEl.innerHTML = '';
      messagesEl.appendChild(welcomeEl);
      messagesEl.appendChild(typingEl);
      welcomeEl.style.display = 'flex';
      typingEl.classList.remove('visible');

      inputEl.value = '';
      autoResize();
      counterEl.textContent = '0 / 4000';
      setLoading(false);
      inputEl.focus();
    });

    // ─── Send message ────────────────────────────────────────────────────
    async function handleSend() {
      const message = inputEl.value.trim();
      if (!message || isLoading) return;

      // Hide welcome screen on first message
      if (welcomeEl.style.display !== 'none') {
        welcomeEl.style.display = 'none';
      }

      appendMessage('user', message);
      inputEl.value = '';
      autoResize();
      counterEl.textContent = '0 / 4000';
      setLoading(true);

      try {
        const res = await fetch('/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ message, conversation_id: conversationId }),
          signal: AbortSignal.timeout(25000),
        });

        const data = await res.json();

        if (!res.ok) {
          const errMsg = data?.detail || getDefaultError(res.status);
          appendError(errMsg, res.status);
        } else {
          conversationId = data.conversation_id;
          appendMessage('bot', data.reply);
        }
      } catch (err) {
        if (err.name === 'TimeoutError' || err.name === 'AbortError') {
          appendError('The request timed out. Please check your connection and try again.', 504);
        } else {
          appendError('Could not reach the server. Make sure the backend is running.', 0);
        }
      } finally {
        setLoading(false);
      }
    }

    // ─── DOM Helpers ─────────────────────────────────────────────────────
    function appendMessage(role, text) {
      const row = document.createElement('div');
      row.className = `message-row ${role}`;

      const avatar = document.createElement('div');
      avatar.className = `avatar ${role === 'bot' ? 'bot-avatar' : 'user-avatar'}`;
      avatar.textContent = role === 'bot' ? '🎓' : '👤';

      const bubble = document.createElement('div');
      bubble.className = `bubble ${role}`;
      bubble.innerHTML = formatText(text);

      row.appendChild(avatar);
      row.appendChild(bubble);

      // Insert before the typing indicator
      messagesEl.insertBefore(row, typingEl);
      scrollToBottom();
    }

    function appendError(message, statusCode) {
      const banner = document.createElement('div');
      banner.className = 'error-banner';
      banner.setAttribute('role', 'alert');

      const icon = statusCode === 429 ? '⏳'
                 : statusCode === 504 ? '⌛'
                 : '⚠️';

      banner.innerHTML = `<span class="err-icon">${icon}</span><span>${escapeHtml(message)}</span>`;
      messagesEl.insertBefore(banner, typingEl);
      scrollToBottom();
    }

    function getDefaultError(status) {
      const map = {
        429: 'Rate limit reached. Please wait a moment and try again.',
        502: 'The AI service returned an error. Please try again.',
        504: 'The request timed out after 20 seconds. Please try again.',
        422: 'Your message could not be processed. Please try rephrasing.',
      };
      return map[status] || `An unexpected error occurred (HTTP ${status}).`;
    }

    function setLoading(state) {
      isLoading = state;
      sendBtn.disabled = state;
      inputEl.disabled = state;
      typingEl.classList.toggle('visible', state);
      if (state) scrollToBottom();
    }

    function scrollToBottom() {
      requestAnimationFrame(() => {
        messagesEl.scrollTop = messagesEl.scrollHeight;
      });
    }

    // ─── Text Formatting ─────────────────────────────────────────────────
    // Minimal markdown-like rendering: **bold**, `code`, line breaks
    function formatText(text) {
      return escapeHtml(text)
        .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
        .replace(/`([^`]+)`/g, '<code>$1</code>')
        .replace(/\n/g, '<br>');
    }

    function escapeHtml(str) {
      return str
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    // ─── Init ────────────────────────────────────────────────────────────
    inputEl.focus();
  </script>
</body>
